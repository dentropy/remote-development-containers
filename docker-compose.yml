services:
  filebrowser:
    image: gtstef/filebrowser:stable
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
    volumes:
      - ./config-filebrowser:/home/filebrowser/data
      - /home/:/files
    ports:
      - "2000:80"
    restart: unless-stopped

  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/dentropy/Documents/Root:/config
    ports:
      - "3000:3000"
      - "3001:3001"
    shm_size: "1gb"
    restart: unless-stopped

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - PASSWORD=${PASSWORD}
      - SUDO_PASSWORD=${SUDO_PASSWORD}
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - ./config-code-server:/config
      - ./settings-code-server.json:/config/data/User/settings.json
      - /home/dentropy/:/config/workspace
    ports:
      - "4000:8443"
    restart: unless-stopped