services:
  filebrowser:
    image: gtstef/filebrowser:stable
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
    volumes:
      - ./config-filebrowser:/home/filebrowser/data
      - /home/:/files
    ports:
      - "2000:80"
    restart: unless-stopped

  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CUSTOM_USER=admin
      - PASSWORD=${PASSWORD}
      - SELKIES_ENABLE_BINARY_CLIPBOARD=true
    volumes:
      - /home/dentropy/Vaults:/config
    ports:
      - "3000:3000"
      - "3001:3001"
    shm_size: "1gb"
    restart: unless-stopped

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - PASSWORD=${PASSWORD}
      - SUDO_PASSWORD=${SUDO_PASSWORD}
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - ./config-code-server:/config
      - ./settings-code-server.json:/config/data/User/settings.json
      - /home/dentropy/:/config/workspace
    expose:
      - "8443"
    restart: unless-stopped

  ignis:
    image: nobbe/ignis:latest
    expose:
      - "8080"
    environment:
      - PUID=1000
      - PGID=1000
      - OBSIDIAN_VERSION=1.12.7   # pinned by the project
    volumes:
      - /home/dentropy/Vaults:/vaults
      - ./config-obsidian-ingis/data:/app/data
      - ./config-obsidian-ignis/app:/app/obsidian-app
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "3002:3002"
      - "4000:4000"
    volumes:
      - ./config-caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ignis
      - code-server
    restart: unless-stopped

volumes:
  obsidian-app:
  caddy-data:
  caddy-config:
